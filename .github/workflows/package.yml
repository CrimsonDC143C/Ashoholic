name: Package addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ashoholic.zip
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Ashoholic.toc | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "Version missing from Ashoholic.toc" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          rm -rf package
          mkdir -p package/Ashoholic package/FastSwap package/SharedMedia
          cp Ashoholic.toc package/Ashoholic/Ashoholic.toc
          cp Ashoholic.bat AshoholicMerge.ps1 AshoholicSync.ps1 \
             Characters.lua Core.lua Minimap.lua Themes.lua UI.lua NexusDock.lua \
             package/Ashoholic/
          cp -a Libraries package/Ashoholic/Libraries
          cp FastSwap/FastSwap.toc FastSwap/FastSwap.lua FastSwap/FastSwap_Glue.lua \
             FastSwap/Sync-FastSwapGlue.ps1 package/FastSwap/
          cp -a SharedMedia/. package/SharedMedia/
          (cd package && zip -r ../Ashoholic.zip Ashoholic FastSwap SharedMedia)
          unzip -l Ashoholic.zip
          unzip -l Ashoholic.zip | grep -q 'Ashoholic/Ashoholic.toc'
          unzip -l Ashoholic.zip | grep -q 'FastSwap/FastSwap.toc'
          unzip -l Ashoholic.zip | grep -q 'SharedMedia/SharedMedia.toc'

      - name: Publish Ashoholic.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Extract Ashoholic.zip into Interface/AddOns. The archive contains an Ashoholic folder, a FastSwap folder, and a SharedMedia folder."
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" Ashoholic.zip --clobber
            gh release edit "v$version" --notes "$notes"
          else
            gh release create "v$version" Ashoholic.zip \
              --title "Ashoholic v$version" \
              --latest \
              --notes "$notes"
          fi
