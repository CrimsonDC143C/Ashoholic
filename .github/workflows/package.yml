name: Package addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read addon version
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Ashoholic.toc | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "Version missing from Ashoholic.toc" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build Ashoholic.zip
        run: python3 tools/check_package.py --zip Ashoholic.zip

      - name: Publish Ashoholic.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Extract Ashoholic.zip into Interface/AddOns. The archive contains an Ashoholic folder, a FastSwap folder, and a SharedMedia folder."
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" Ashoholic.zip --clobber
            gh release edit "v$version" --notes "$notes"
          else
            gh release create "v$version" Ashoholic.zip \
              --title "Ashoholic v$version" \
              --latest \
              --notes "$notes"
          fi
