name: Package PTR addon

on:
  push:
    branches:
      - PTR-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashoholic-ptr-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/PTR-main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ashoholic-PTR.zip
        run: python3 tools/check_package.py --ptr-preview --zip Ashoholic-PTR.zip

      - name: Publish PTR prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ptr-latest"
          notes="Experimental UI preview from PTR-main, commit ${GITHUB_SHA}. For the Ebonhold PTR client only. Close WoW, remove any previous Ashoholic folder, and extract Ashoholic-PTR.zip into your PTR client's Interface/AddOns folder. The archive contains only the Ashoholic preview manifest, loader, color picker, and mock UI; it does not include the live roster, FastSwap, or SharedMedia. ProjectEbonhold must already be installed. Back up your PTR SavedVariables before testing. Use /ash preview to open the mock UI. This is a rolling build; the download is replaced after each successful PTR publication."

          # Only the dedicated rolling PTR tag moves; live release tags are untouched.
          git tag --force "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force

          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == "ptr-latest") | .id')"
          if [ -n "$release_id" ]; then
            gh release edit "$tag" \
              --title "Ashoholic PTR - latest testing build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
            gh release upload "$tag" Ashoholic-PTR.zip --clobber
          else
            gh release create "$tag" Ashoholic-PTR.zip \
              --verify-tag \
              --title "Ashoholic PTR - latest testing build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
